<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artificial Star — Staff Directory</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --fg: #1a1d21;
      --muted: #6b7280;
      --accent: #b3122e;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1115;
        --card: #171a20;
        --fg: #e7e9ec;
        --muted: #9aa3ad;
        --accent: #ff4d64;
        --border: #262a31;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 24px 16px;
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    header { margin-bottom: 20px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { color: var(--muted); font-size: 13px; }
    .search {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card);
      color: var(--fg);
      font-size: 14px;
      margin: 14px 0 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .name { font-weight: 600; }
    .handle { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .bio { font-size: 13px; }
    .role {
      display: inline-block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
      margin-top: 8px;
    }
    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }
    code {
      background: var(--border);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Artificial Star — Staff Directory</h1>
      <div class="sub">Public roster. All records fictional.</div>
    </header>

    <input class="search" id="q" placeholder="Search by name or bio..." autocomplete="off" />

    <div class="grid" id="grid"></div>

    <footer>
      Public API:
      <code>GET /api/users</code> ·
      <code>GET /api/users/search?q=…</code> ·
      <code>GET /api/users/:id</code> ·
      <code>POST /api/login</code>
    </footer>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const q = document.getElementById('q');

    function render(users) {
      grid.innerHTML = users.map(u => `
        <div class="card">
          <div class="name">${u.fullName ?? ''}</div>
          <div class="handle">@${u.username ?? ''}</div>
          <div class="bio">${u.bio ?? ''}</div>
          <div class="role">${u.role ?? ''}</div>
        </div>
      `).join('');
    }

    async function load(query) {
      const url = query
        ? `/api/users/search?q=${encodeURIComponent(query)}`
        : '/api/users';
      const r = await fetch(url);
      render(await r.json());
    }

    let timer;
    q.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => load(q.value.trim()), 150);
    });

    load('');
  </script>
</body>
</html>
